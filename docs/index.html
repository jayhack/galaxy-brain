<!doctype html>
<html lang="en" data-theme="globule">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>galaxy-brain — agent evals</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cdefs%3E%3CradialGradient%20id='g'%20cx='34%25'%20cy='30%25'%20r='75%25'%3E%3Cstop%20offset='0%25'%20stop-color='%23ffffff'/%3E%3Cstop%20offset='12%25'%20stop-color='%23bdeef5'/%3E%3Cstop%20offset='52%25'%20stop-color='%232DC4D8'/%3E%3Cstop%20offset='100%25'%20stop-color='%23126974'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect%20width='100'%20height='100'%20fill='%23F2EAD0'/%3E%3Ccircle%20cx='50'%20cy='52'%20r='33'%20fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="A collection of agent evals. Browse evals, harnesses, models, and outcomes."
    />

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        daisyui: {
          themes: [
            {
              globule: {
                "color-scheme": "light",
                primary: "#0A0908",
                "primary-content": "#F2EAD0",
                secondary: "#2DC4D8",
                "secondary-content": "#0A0908",
                accent: "#E04691",
                "accent-content": "#F2EAD0",
                neutral: "#0A0908",
                "neutral-content": "#F2EAD0",
                "base-100": "#F2EAD0",
                "base-200": "#EFE3C2",
                "base-300": "#E0CF9E",
                "base-content": "#0A0908",
                info: "#2347C8",
                "info-content": "#F2EAD0",
                success: "#316E1E",
                "success-content": "#F2EAD0",
                warning: "#8E6A0C",
                "warning-content": "#F2EAD0",
                error: "#6E1A45",
                "error-content": "#F2EAD0",
                "--rounded-box": "0rem",
                "--rounded-btn": "0rem",
                "--rounded-badge": "0rem",
                "--tab-radius": "0rem",
                "--border-btn": "1px",
                "--animation-btn": "0s",
                "--animation-input": "0s",
              },
            },
          ],
        },
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
              display: ['"Archivo Black"', '"Helvetica Neue"', 'Arial', 'sans-serif'],
              serif: ['"Playfair Display"', 'Georgia', 'serif'],
            },
          },
        },
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="paper min-h-screen text-base-content font-sans antialiased">
    <div class="drawer lg:drawer-open">
      <input id="nav-drawer" type="checkbox" class="drawer-toggle" />

      <div class="drawer-content flex flex-col">
        <!-- Masthead / navbar -->
        <header
          id="main-navbar"
          class="flex flex-col lg:flex-row lg:items-center lg:min-h-16 lg:h-16 paper-soft sticky top-0 z-30 border-b border-[var(--ink)]"
        >
          <div
            class="navbar min-h-0 h-auto py-0 flex flex-row flex-nowrap items-center justify-between min-h-14 h-14 shrink-0 lg:min-h-16 lg:h-16 lg:flex-none lg:order-2 lg:w-auto px-3 lg:px-5"
          >
            <div class="flex-none lg:hidden">
              <label
                for="nav-drawer"
                class="g-icon-btn"
                aria-label="open menu"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="inline-block w-5 h-5 stroke-current"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"
                  />
                </svg>
              </label>
            </div>

            <a
              id="navbar-brand"
              href="#/"
              class="logo-lockup lg:hidden"
              aria-label="galaxy-brain — home"
            >
              <span class="logo-monogram" aria-hidden="true">
                <span class="logo-letter">G</span>
                <span class="globule g-cyan logo-dot"></span>
              </span>
              <span class="logo-wordmark">galaxy-brain</span>
            </a>

            <div class="flex-1 min-w-0 lg:hidden" aria-hidden="true"></div>

            <div class="flex-none flex items-center gap-3">
              <span class="mono-label hidden sm:inline opacity-60">Agent&nbsp;Evals</span>
              <a
                id="navbar-source"
                href="#"
                target="_blank"
                rel="noopener"
                class="g-btn g-btn-paper g-btn-xs hidden sm:inline-flex"
                >Source →</a
              >
            </div>
          </div>

          <div
            id="header-breadcrumbs"
            class="order-3 w-full min-w-0 border-t border-[var(--ink)] py-2 px-4 sm:px-6 lg:order-1 lg:flex-1 lg:border-t-0 lg:py-0 lg:px-10 flex items-center overflow-x-auto overflow-y-hidden lg:overflow-hidden max-w-6xl lg:mx-auto"
            aria-live="polite"
          ></div>
        </header>

        <!-- View root -->
        <main id="view" class="flex-1 px-4 sm:px-6 lg:px-10 py-8 max-w-6xl w-full mx-auto">
          <div class="flex items-center justify-center py-24">
            <span class="loading loading-dots loading-lg text-secondary"></span>
          </div>
        </main>

        <footer class="border-t border-[var(--ink)] mt-4">
          <div
            class="max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-10 py-6 flex flex-col sm:flex-row items-center justify-between gap-3"
          >
            <div class="flex items-center gap-2.5">
              <span class="logo-monogram logo-monogram--sm" aria-hidden="true">
                <span class="logo-letter">G</span>
                <span class="globule g-cyan logo-dot"></span>
              </span>
              <span class="stamp-block">
                galaxy-brain<br />
                agent × evals · static site
              </span>
            </div>
            <p class="mono-label opacity-60">
              <a id="footer-repo-link" class="g-link" href="#">view source on github →</a>
            </p>
          </div>
        </footer>
      </div>

      <!-- Sidebar -->
      <aside class="drawer-side z-40">
        <label for="nav-drawer" class="drawer-overlay" aria-label="close menu"></label>
        <div class="min-h-full w-72 paper-soft border-r border-[var(--ink)] flex flex-col">
          <div
            class="sidebar-brand shrink-0 h-16 min-h-16 px-4 border-b border-[var(--ink)] flex items-center overflow-hidden"
          >
            <a href="#/" class="logo-lockup flex items-center gap-2.5 min-w-0 flex-1">
              <span class="logo-monogram" aria-hidden="true">
                <span class="logo-letter">G</span>
                <span class="globule g-cyan logo-dot"></span>
              </span>
              <span class="min-w-0 flex-1 flex flex-col justify-center">
                <span class="logo-wordmark truncate">galaxy-brain</span>
                <span class="mono-label opacity-55 truncate">A collection of agent evals</span>
              </span>
            </a>
          </div>

          <nav id="sidebar-nav" class="p-2 flex-1 overflow-y-auto">
            <!-- populated by app.js -->
          </nav>

          <div class="shrink-0 border-t border-[var(--ink)] px-4 py-3 stamp-block opacity-70">
            cream · ink · six globules
          </div>
        </div>
      </aside>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
